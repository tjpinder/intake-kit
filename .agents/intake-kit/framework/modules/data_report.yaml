# Data / report -> metric spec, or a pointer to an existing asset. No decision means don't build.
module: data_report
applies_to: data_report
methods: [decision-first metric definition]

# Interview engine v2 asks this area first.
anchor: data_report.decision

areas:
  - id: data_report.decision
    must_capture: What the user will do differently when they see the number
    packet:
      ask: "What will you do differently when you see this report?"
      why: "A report nobody acts on isn't worth building; the decision is what it's for."
      example: "Decide which suppliers to call about late deliveries that week."
    probes:
      - "What will you do differently when you see this?"
    always_ask: true
    critical: true
    followup_conditions:
      - when: the answer is "it would be good to know" or similar, with no action
        ask: "Tell me about the last time you wished you'd had this number. What would you have done?"
    feeds:
      - { file: SPEC.md, section: problem }
      - { file: DECISIONS.md, section: gate }

  - id: data_report.definition
    must_capture: Exactly how the thing is counted, what's in and what's out
    packet:
      ask: "How exactly is one counted? What's in and what's out?"
      why: "Two people counting \"the same thing\" differently is the most common reason reports get distrusted."
      example: "A late delivery is anything after the agreed date. Cancelled orders don't count."
    probes:
      - "How exactly do you count one? What's in and what's out?"
    critical: true
    followup_conditions: []
    feeds:
      - { file: SPEC.md, section: mvp }
      - { file: ACCEPTANCE.md, section: criteria }

  - id: data_report.grain
    must_capture: The level of detail and the time window
    packet:
      ask: "At what level of detail, and over what time window? Per order, line, person, shift or zone; daily, weekly?"
      why: "The level of detail decides what data is needed and how it's grouped."
      example: "Per supplier, per week, for the last three months."
    probes:
      - "Per order, line, person, shift or zone? Over what window?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: SPEC.md, section: mvp }
      - { file: ACCEPTANCE.md, section: criteria }

  - id: data_report.truth
    must_capture: Which system's number wins when sources disagree
    packet:
      ask: "When two systems give different numbers, which one wins?"
      why: "If nobody decides, every disagreement turns into an argument about the report."
      example: "Our main system wins over the spreadsheet."
    probes:
      - "Which system's number do you trust when they disagree?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: SPEC.md, section: data }
      - { file: ACCEPTANCE.md, section: error_cases }

  - id: data_report.delivery
    must_capture: How fresh it must be and where it should appear
    packet:
      ask: "How fresh does it need to be, and where do you want to see it?"
      why: "Freshness and location decide how it's delivered: an email, a screen, a file."
      example: "By 8am each Monday, as an email to the team leads."
    probes:
      - "How fresh does it need to be, and where do you want to see it?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: SPEC.md, section: mvp }
      - { file: ACCEPTANCE.md, section: criteria }

  - id: data_report.existing
    must_capture: Any existing report that's close, and what's wrong with it
    packet:
      ask: "Is there a report or screen today that's close to this? What's missing from it?"
      why: "If something already covers it, the answer might be to fix that, not to build new."
      example: "The system's dashboard shows totals, but nothing per supplier."
    probes:
      - "Is there a report today that's close? What's wrong with it?"
    always_ask: true
    critical: false
    followup_conditions: []
    feeds:
      - { file: DECISIONS.md, section: gate }
