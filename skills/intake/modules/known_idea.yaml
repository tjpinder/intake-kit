# Known idea -> feasibility read + spec. Methods: The Mom Test, jobs-to-be-done.
# A stated solution is a hypothesis: always walk back to current behavior before scoring.
module: known_idea
applies_to: known_idea
methods: [The Mom Test (Rob Fitzpatrick), jobs-to-be-done]
adoption_forces: [push, pull, anxiety, habit]
# Constraints are optional for most types, but a known idea usually arrives with them (stack,
# licence, what it mustn't do), and the first live test lost all of them.
asks_core: [core.constraints]

areas:
  - id: known_idea.current
    must_capture: What happens today when this gets done, from the last real instance
    probes:
      - "What happens today when this gets done? Walk me through the last time."
    critical: true
    followup_conditions:
      - when: the user keeps describing the proposed solution instead of today
        ask: "Before the new version, walk me through the last time it got done."
    feeds:
      - { file: SPEC.md, section: current_state }

  # Found in the first live test: a known idea with a detailed plan behind it had nowhere to
  # record the plan, so the smallest version and what's out of scope were guessed.
  - id: known_idea.proposal
    must_capture: What they propose to build, its main parts, the smallest version that would be useful, and what's deliberately left out
    probes:
      - "What would the first version include, and what would you leave out?"
      - "If you could only build one part of it, which would it be?"
    critical: true
    followup_conditions:
      - when: the parts are named but not what's left out
        ask: "What's deliberately not in the first version?"
    feeds:
      - { file: SPEC.md, section: mvp }
      - { file: SPEC.md, section: out_of_scope }

  - id: known_idea.push
    must_capture: The worst part of how it's done now
    probes:
      - "What's the worst part of how it's done now?"
    always_ask: true
    critical: false
    followup_conditions: []
    feeds:
      - { file: SPEC.md, section: problem }
      - { file: DECISIONS.md, section: adoption_risks }

  - id: known_idea.pull
    must_capture: What would be different on a normal day if it worked
    probes:
      - "If it worked perfectly, what would be different on a normal Tuesday?"
    always_ask: true
    critical: false
    followup_conditions: []
    feeds:
      - { file: SPEC.md, section: success_metric }
      - { file: DECISIONS.md, section: adoption_risks }

  - id: known_idea.adoption
    must_capture: What would stop people trusting it and what they'd keep doing the old way
    probes:
      - "What would make you not trust it? What would people keep doing the old way?"
    always_ask: true
    critical: false
    followup_conditions: []
    feeds:
      - { file: DECISIONS.md, section: adoption_risks }
      - { file: GUARDRAILS.md, section: review_points }

  - id: known_idea.prior
    must_capture: Previous attempts and what happened
    probes:
      - "Has anyone tried to solve this before? What happened?"
    always_ask: true
    critical: false
    followup_conditions: []
    feeds:
      - { file: DECISIONS.md, section: gate }

  - id: known_idea.existing
    # Found in the first live test: the warehouse wording (WMS, ERP, BI) was asked word for word
    # about a repo of documents and scripts.
    must_capture: Whether a tool they already have, or one they could get, already does something close
    probes:
      - "Does anything you already use, or could easily get, do something close to this?"
    always_ask: true
    critical: false
    followup_conditions: []
    feeds:
      - { file: DECISIONS.md, section: gate }
