# Migration modifier. Items carrying it route to Gather more discovery.
module: mod.migration
applies_to: modifier
effects: { gate: gather_more }

areas:
  - id: mod.migration.parity
    must_capture: What "the same as before" means
    packet:
      ask: "How will you know the new one does everything the old one did?"
      why: "What counts as the same as before has to be written down, or something gets lost."
      example: "Same totals on the five reports the leads use, to the unit."
    probes:
      - "How will you know the new one does everything the old one did?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: ACCEPTANCE.md, section: criteria }

  - id: mod.migration.reconciliation
    must_capture: How old and new results are compared
    packet:
      ask: "How would you compare old and new results side by side?"
      why: "Running both and comparing is how a migration is proven before switching."
      example: "Run both for two weeks and compare the daily totals."
    probes:
      - "How would you compare old and new results side by side?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: ACCEPTANCE.md, section: criteria }

  - id: mod.migration.cutover
    must_capture: The cutover plan and window
    packet:
      ask: "When could you switch over, and what has to be frozen while you do?"
      why: "The cutover window decides the plan and its risks."
      example: "A Sunday night, with no new orders between 10pm and 4am."
    probes:
      - "When could you switch over, and what has to be frozen while you do?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: SPEC.md, section: constraints }

  - id: mod.migration.rollback
    must_capture: How to go back if it fails
    packet:
      ask: "If the new one fails after the switch, how do you go back?"
      why: "A way back is what makes a switch safe to try."
      example: "Keep the old system read-only for a month, so we can turn it back on."
    probes:
      - "If the new one fails after cutover, how do you go back?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: GUARDRAILS.md, section: fallback }
      - { file: GUARDRAILS.md, section: kill_criteria }
