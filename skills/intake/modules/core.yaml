# Shared core: applies to every item, captured once per session. An item overrides an area
# only when its answer differs (core_overrides in the session file).
module: core
applies_to: all

areas:
  - id: core.users
    must_capture: Who does the work, who uses the output, who owns the process, who signs off
    packet:
      ask: "Who's involved: who does the work today, who uses the result, who owns the process, and who signs off on changes?"
      why: "Knowing who uses it and who can say yes keeps the build pointed at the right people."
      example: "Two planners would use it daily, their manager owns the process, and IT approves anything new."
      examples:
        known_idea: "Two planners would use it daily, their manager owns the process, and IT approves anything new."
        data_report: "A coordinator pulls it together today, three team leads use it, and the operations manager signs off on changes."
        manual_process: "Two clerks do it, the team lead checks their work, and the finance manager owns the process."
        broken: "The night team hits it first, IT support fixes it, and the operations manager decides what gets prioritised."
        exploratory: "The team leads see the problems first, the department head decides what to try, and IT would build it."
    probes:
      - "Who touches this, first person to last?"
      - "Who can say yes to changing it?"
    critical: true
    followup_conditions:
      - when: no owner or approver has been named
        ask: "Who can say yes to changing it?"
    feeds:
      - { file: SPEC.md, section: users }
      - { file: DECISIONS.md, section: assumptions }

  - id: core.outcome
    must_capture: Baseline, target, how it's measured, what we won't claim
    packet:
      ask: "How would you know this worked? What's it costing today, in hours, errors or money, and what would good look like?"
      why: "A number for today and a target are what make an improvement something you can check."
      example: "Today it's done differently by each person. It would be working if everyone used one version and the errors stopped."
      examples:
        known_idea: "Today it's done differently by each person. It would be working if everyone used one version and the errors stopped."
        data_report: "Today nobody can see it until month end. It would be working if the leads saw it each morning and acted on it."
        manual_process: "Today it takes most of a morning. It would be working if it took minutes and nobody had to re-check it."
        broken: "Today a few orders a day need fixing by hand. It would be working if none did."
        exploratory: "Today we don't know where the time goes. Success is a short list of things worth fixing first."
    probes:
      - "How do you know today whether it went well?"
      - "What number would tell you this worked?"
      - "What's it costing now, in hours, errors or chargebacks?"
    critical: true
    followup_conditions:
      - when: a target is given with no baseline
        ask: "What's it costing now, in hours, errors or chargebacks?"
      - when: success is described without a number
        ask: "What number would tell you this worked?"
    feeds:
      - { file: SPEC.md, section: success_metric }
      - { file: ACCEPTANCE.md, section: criteria }

  - id: core.data
    must_capture: Sources, system of record, how structured, quality issues, sensitivity, real examples
    packet:
      ask: "Where does the information come from, which copy do you trust, and is any of it sensitive?"
      why: "The build has to read from the right source, and sensitive data changes what's allowed."
      example: "Mostly in our main system, plus a shared spreadsheet; the system is the copy we trust. No personal data."
      examples:
        known_idea: "Mostly in our main system, plus a shared spreadsheet; the system is the copy we trust. No personal data."
        data_report: "It comes from our main system's reporting copy; that's the one we trust. No customer or pricing data."
        manual_process: "We export it from the main system into a spreadsheet; the system is the copy we trust."
        broken: "The records come from a partner's feed into our system; the partner's copy is the original."
        exploratory: "Spread across email, spreadsheets and our main system. Some of it has customer details."
    probes:
      - "Where does that live, and which copy do you trust?"
      - "Show me one real example."
      - "Any customer, employee, pricing or personal data in it?"
    critical: true
    followup_conditions:
      - when: sensitivity hasn't been stated
        ask: "Any customer, employee, pricing or personal data in it?"
    feeds:
      - { file: SPEC.md, section: data }
      - { file: GUARDRAILS.md, section: data_handling }
    guardrail: flagged_paths

  - id: core.systems
    must_capture: Apps touched, access method, changes expected in 6 months
    packet:
      ask: "Which screens, systems or files do you use for this, and is anything changing in them in the next six months?"
      why: "The systems decide how it can be built, and an upcoming change can make a build wasted."
      example: "Our main system and a shared drive. Nothing is changing in the next six months that I know of."
      examples:
        known_idea: "Our main system and a shared drive. Nothing is changing in the next six months that I know of."
        data_report: "Our main system and a spreadsheet. There's an upgrade planned for next year."
        manual_process: "Our main system, a spreadsheet and email."
        broken: "Our main system and the partner's portal. A new version went live last month."
        exploratory: "Email, spreadsheets and our main system. We're looking at replacing one of them."
    probes:
      - "Which screens or systems do you open?"
      - "Any upgrades planned in the next six months?"
    critical: false
    followup_conditions:
      - when: systems are named but access method isn't
        ask: "How do you get at it today: a screen, an export, a database?"
    feeds:
      - { file: SPEC.md, section: systems }
      - { file: CLAUDE.md, section: stack }

  - id: core.constraints
    must_capture: Policy, compliance, SLAs, timing windows, approvals
    packet:
      ask: "Are there rules it must follow: policies, deadlines, time windows, approvals, or anyone outside your team who requires it?"
      why: "Constraints rule options in or out before anyone starts building."
      example: "IT has to approve anything new, and it can't change how we bill customers."
      examples:
        known_idea: "IT has to approve anything new, and it can't change how we bill customers."
        data_report: "It has to be ready before the morning meeting. Nothing outside the team requires it."
        manual_process: "Finance needs it by the third working day of the month."
        broken: "Customer orders have to ship the same day, so fixes can't wait for the next release."
        exploratory: "Any change needs the department head's sign-off, and the budget is small this year."
    probes:
      - "Is anyone outside your team requiring this?"
      - "When does it have to be done each day?"
    # Always asked, whatever modifiers apply: a compliance or migration area also feeds the
    # constraints section, which otherwise dropped it from the required list.
    always_ask: true
    critical: false
    followup_conditions:
      - when: an outside requirement is mentioned
        ask: "Who set that requirement, and where is it written down?"
    feeds:
      - { file: SPEC.md, section: constraints }

  - id: core.trust
    must_capture: Cost of a wrong output, who catches errors, required review, fallback, what would make them switch it off
    packet:
      ask: "When it goes wrong, who catches it today, how bad is a wrong result, and what would you do if the new thing stopped working?"
      why: "This sets how much checking a person must do, and what the fallback is."
      example: "A lead spots odd results. If it got one wrong, a customer would notice. If it broke, we'd go back to doing it by hand."
      examples:
        known_idea: "A lead spots odd results. If it got one wrong, a customer would notice. If it broke, we'd go back to doing it by hand."
        data_report: "A team lead spots odd numbers. A wrong number means acting on the wrong thing. If it broke, we'd go back to the spreadsheet."
        manual_process: "The team lead checks a sample. A mistake means a payment goes out wrong. If the new way broke, we'd do it by hand again."
        broken: "Customers notice first, which is the problem. If a fix made it worse, we'd roll it back."
        exploratory: "Nobody checks today. We'd want a person to review anything before it changes how we work."
    probes:
      - "When this goes wrong today, who catches it?"
      - "Worst outcome if an automated version got one wrong?"
      - "Would you approve its output, or let it act alone?"
      - "If it stopped working, what would you do?"
      - "What would make you switch it off?"
    critical: true
    followup_conditions:
      - when: no manual fallback has been described
        ask: "If it stopped working, what would you do?"
    feeds:
      - { file: ACCEPTANCE.md, section: error_cases }
      - { file: GUARDRAILS.md, section: kill_criteria }
      - { file: GUARDRAILS.md, section: fallback }
      - { file: GUARDRAILS.md, section: review_points }
    guardrail: kill_criteria
