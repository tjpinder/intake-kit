# Router: classifies each pain the user describes into one entry type, attaches modifiers,
# and names the coverage modules that apply. The model reads this; code checks the IDs.
framework_version: 0.1.0

types:
  broken:
    label: Broken
    signals: ["isn't working", "stopped", "errors", "failing", "broke", "a system name plus a failure verb"]
    low_confidence_probe: "Did this used to work? When did you first notice?"
    output: diagnostic_brief
    module: broken
  manual_process:
    label: Manual process
    signals: ["by hand", "every morning I", "every Monday", "copy/paste", "paste into", "takes hours", "manually", "spreadsheet I build", "in Excel"]
    low_confidence_probe: "Walk me through the last time, start to finish."
    output: process_map
    module: manual_process
  known_idea:
    label: Known idea
    signals: ["can we automate", "could AI", "can AI", "could AI do", "a named solution", "we should build", "what if we had a bot"]
    low_confidence_probe: "What happens today when this gets done?"
    output: feasibility_spec
    module: known_idea
  exploratory:
    label: Exploratory
    signals: ["where could AI help", "no specific process", "what should we automate", "ideas for AI"]
    low_confidence_probe: "What work does nobody value but someone has to do?"
    output: opportunity_backlog
    module: exploratory
  data_report:
    label: Data / report
    signals: ["I need a report of", "how many", "a metric noun", "dashboard", "a view of"]
    low_confidence_probe: "What will you do differently when you see this number?"
    output: metric_spec
    module: data_report

modifiers:
  integration:
    label: Integration
    signals: ["sync", "feed", "EDI", "API", "interface", "integrating"]
    module: mod.integration
  compliance:
    label: Compliance / audit
    signals: ["audit", "regulator", "customer requirement", "SOX", "retention"]
    module: mod.compliance
    effects: { risk_tier: high }
  migration:
    label: Migration
    signals: ["moving from", "migrating", "replacing", "cutover"]
    module: mod.migration
    effects: { gate: gather_more }

rules:
  record: [type, confidence, trigger_quote]
  confidence: [high, med, low]
  reclassify_min_signals: 2
  reclassify_also_when: "the user's story contradicts the label"
  carry_over_on_reclassify: [core]
  one_item_per_pain: true
  idea_first_walks_back_to_current: true
  log_reclassifications_to: DECISIONS.md

# Interview engine v2: the only questions that can create an item. Code asks them, the model
# classifies the reply as yes / no / unclear with a quote, and code creates the item only on yes
# with a grounded quote. Unclear is asked once more, then treated as no.
checks:
  manual_work:
    # Asked once on the primary item, after its required areas, when the user mentioned work done
    # by hand (a manual_process signal, not negated) and no manual-process item exists.
    applies_to: [data_report, known_idea, broken]
    must_capture: Whether the manual work they mentioned happens today (not only as a fallback if the new thing failed), when it last happened, and whether the new thing would replace it
    spawns: manual_process
    light_pass: [core.users, core.outcome, manual_process.volume]
  existing_asset:
    # Rides on the module's existing-asset question. It records the answer; it creates no item
    # until a follow-on type for existing assets is decided (spawns: null).
    areas: [data_report.existing, known_idea.existing]
    spawns: null
    light_pass: []
