# Compliance / audit modifier. Sets the item's risk tier to high.
module: mod.compliance
applies_to: modifier
effects: { risk_tier: high }

areas:
  - id: mod.compliance.requirement_source
    must_capture: Who requires it and where the requirement is written
    packet:
      ask: "Who requires this, and where is the requirement written down?"
      why: "The source of a requirement decides what exactly must be met."
      example: "Our largest customer's routing guide, section 4."
    probes:
      - "Who requires this, and where is it written down?"
    critical: true
    followup_conditions: []
    feeds:
      - { file: SPEC.md, section: constraints }
      - { file: GUARDRAILS.md, section: review_points }

  - id: mod.compliance.evidence
    must_capture: What evidence must be produced
    packet:
      ask: "What would you have to show an auditor or the customer to prove it was done right?"
      why: "Evidence has to be designed in from the start, not added later."
      example: "A log of every change with who made it and when."
    probes:
      - "What would you have to show an auditor?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: ACCEPTANCE.md, section: criteria }

  - id: mod.compliance.retention
    must_capture: How long records must be kept
    packet:
      ask: "How long do the records have to be kept?"
      why: "Retention decides where records are stored and when they can be deleted."
      example: "Seven years."
    probes:
      - "How long do the records have to be kept?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: GUARDRAILS.md, section: data_handling }

  - id: mod.compliance.reviewer
    must_capture: Who reviews changes and outputs
    packet:
      ask: "Who has to review changes to this, or its results, before they go live?"
      why: "A required reviewer has to be part of the plan, or the work stalls at the end."
      example: "The quality manager approves any change to the process."
    probes:
      - "Who has to review changes to this before they go live?"
    critical: false
    followup_conditions: []
    feeds:
      - { file: GUARDRAILS.md, section: review_points }
      - { file: GUARDRAILS.md, section: flagged_paths }
    guardrail: flagged_paths
