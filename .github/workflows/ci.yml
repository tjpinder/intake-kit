name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # npm test builds dist/ first, then runs unit, golden-file, grounding and end-to-end tests.
      - run: npm test
      - name: dist/ is committed and up to date
        run: git diff --exit-code -- dist/
      - name: Dogfood the guardrail checks on the worked example
        run: node scripts/dogfood.mjs
